syntax = "proto3";

// Package kapa.whatsapp.v1 is the contract of the WhatsApp gateway: it links
// WhatsApp accounts (one per phone number) and exposes their one-to-one
// conversations to the rest of the platform.
package kapa.whatsapp.v1;

option go_package = "kapa/whatsapp/pb;pb";

// WhatsAppService links accounts, sends messages and streams incoming events.
// Phone numbers are international, digits only ("34600111222"); "+", spaces
// and dashes are accepted on input and stripped.
service WhatsAppService {
  // Login starts linking a phone number and returns the pairing code to type on
  // the phone (WhatsApp > Linked devices > Link with phone number). The code is
  // valid for about 160 seconds; the outcome arrives on Subscribe as an
  // AccountEvent (CONNECTED or PAIR_FAILED). Calling Login for an account that
  // already exists returns its state and no code.
  rpc Login(LoginRequest) returns (LoginResponse);
  // Logout unlinks the account from WhatsApp and wipes its session.
  // Fails with FAILED_PRECONDITION while pairing is still pending.
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  // Delete removes the account unconditionally: it tries to unlink it, and
  // wipes the local session even if WhatsApp is unreachable or the session is
  // already invalid. Also cancels a pending pairing.
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  // Send delivers a text, image or audio message to a phone number.
  rpc Send(SendRequest) returns (SendResponse);
  // Subscribe streams events of the selected accounts. Only one-to-one
  // messages are delivered: groups, broadcasts, status updates and channels
  // are discarded. A subscriber that falls behind is disconnected with
  // RESOURCE_EXHAUSTED and must resubscribe.
  rpc Subscribe(SubscribeRequest) returns (stream SubscribeResponse);
  // Status reports the accounts and the WhatsApp protocol versions in use.
  rpc Status(StatusRequest) returns (StatusResponse);
}

// AccountState is the lifecycle state of a linked account.
enum AccountState {
  // ACCOUNT_STATE_UNSPECIFIED is never sent.
  ACCOUNT_STATE_UNSPECIFIED = 0;
  // ACCOUNT_STATE_PAIRING means a pairing code was issued and not used yet.
  ACCOUNT_STATE_PAIRING = 1;
  // ACCOUNT_STATE_CONNECTED means the account is linked and online.
  ACCOUNT_STATE_CONNECTED = 2;
  // ACCOUNT_STATE_DISCONNECTED means the account is linked but offline; it reconnects automatically.
  ACCOUNT_STATE_DISCONNECTED = 3;
  // ACCOUNT_STATE_LOGGED_OUT means the account was unlinked (by Logout, from the phone or by WhatsApp).
  ACCOUNT_STATE_LOGGED_OUT = 4;
  // ACCOUNT_STATE_PAIR_FAILED means the pairing code expired or was rejected.
  ACCOUNT_STATE_PAIR_FAILED = 5;
  // ACCOUNT_STATE_DELETED means the account was removed with Delete.
  ACCOUNT_STATE_DELETED = 6;
  // ACCOUNT_STATE_OUTDATED means WhatsApp rejected the client version: whatsmeow must be updated.
  ACCOUNT_STATE_OUTDATED = 7;
  // ACCOUNT_STATE_BANNED means WhatsApp temporarily banned the account.
  ACCOUNT_STATE_BANNED = 8;
}

// LoginRequest selects the phone number to link.
message LoginRequest {
  // Phone number of the account to link.
  string phone = 1;
}

// LoginResponse carries the pairing code of a new link.
message LoginResponse {
  // Code to type on the phone, formatted "ABCD-EFGH"; empty if the account already existed.
  string pairing_code = 1;
  // Current state of the account.
  AccountState state = 2;
}

// LogoutRequest selects the account to unlink.
message LogoutRequest {
  // Phone number of the account.
  string phone = 1;
}

// LogoutResponse is empty on success.
message LogoutResponse {}

// DeleteRequest selects the account to remove.
message DeleteRequest {
  // Phone number of the account.
  string phone = 1;
}

// DeleteResponse is empty on success.
message DeleteResponse {}

// Media is the payload of an image or audio message.
message Media {
  // Raw (decrypted) file bytes.
  bytes data = 1;
  // MIME type, e.g. "image/jpeg" or "audio/ogg; codecs=opus". Required when sending.
  string mime_type = 2;
  // Caption shown under an image. Ignored for audio.
  string caption = 3;
  // True for a push-to-talk voice note (should be "audio/ogg; codecs=opus"). Ignored for images.
  bool voice_note = 4;
  // Audio duration in seconds, if known. Ignored for images.
  uint32 seconds = 5;
}

// SendRequest describes a message to send.
message SendRequest {
  // Phone number of the sending account.
  string account = 1;
  // Phone number of the recipient.
  string to = 2;
  // Message content; exactly one is required.
  oneof content {
    // Plain text.
    string text = 3;
    // An image with optional caption.
    Media image = 4;
    // An audio file or voice note.
    Media audio = 5;
  }
}

// SendResponse identifies the sent message.
message SendResponse {
  // WhatsApp message ID.
  string id = 1;
  // Server timestamp, Unix seconds.
  int64 timestamp = 2;
}

// SubscribeRequest selects which events to receive. Empty lists match everything.
message SubscribeRequest {
  // Phone numbers of the accounts to follow.
  repeated string accounts = 1;
  // Phone numbers of the contacts to receive messages from. Account events are never filtered by peer.
  repeated string peers = 2;
}

// SubscribeResponse is one event of one account.
message SubscribeResponse {
  // Phone number of the account the event belongs to.
  string account = 1;
  // The event.
  oneof event {
    // An incoming one-to-one message.
    Message message = 2;
    // A change in the account lifecycle.
    AccountEvent account_event = 3;
  }
}

// Message is an incoming one-to-one message.
message Message {
  // WhatsApp message ID.
  string id = 1;
  // Sender phone number, or "lid:<id>" when WhatsApp hides it and it cannot be resolved.
  string from = 2;
  // Sender display name, if known.
  string push_name = 3;
  // Send time, Unix seconds.
  int64 timestamp = 4;
  // True only for "message yourself" chat messages, delivered when WA_SELF_CHAT=1.
  bool from_me = 5;
  // Message content.
  oneof content {
    // Plain text.
    string text = 6;
    // An image, downloaded and decrypted.
    Media image = 7;
    // An audio file or voice note, downloaded and decrypted.
    Media audio = 8;
  }
}

// AccountEvent reports a lifecycle change of an account.
message AccountEvent {
  // New state.
  AccountState state = 1;
  // Human-readable reason, if any.
  string detail = 2;
}

// StatusRequest is empty.
message StatusRequest {}

// StatusResponse describes the gateway.
message StatusResponse {
  // Version of the whatsmeow library compiled in.
  string whatsmeow_version = 1;
  // WhatsApp Web protocol version the client announces.
  string wa_version = 2;
  // True once WhatsApp has rejected the client as outdated.
  bool outdated = 3;
  // All known accounts, sorted by phone number.
  repeated Account accounts = 4;
}

// Account is one known account.
message Account {
  // Phone number.
  string phone = 1;
  // Current state.
  AccountState state = 2;
}
