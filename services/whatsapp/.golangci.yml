# golangci-lint v2 - run with `make lint` (formatting with `make format`).
version: "2"
run:
  build-tags: [integration]
linters:
  default: standard            # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nilerr
    - perfsprint
    - prealloc
    - revive
    - unconvert
    - unparam
    - usestdlibvars
  settings:
    errcheck:
      exclude-functions:
        - (*google.golang.org/grpc.ClientConn).Close
        - (io.ReadCloser).Close
        - (*database/sql.DB).Close
        - (*database/sql.Rows).Close
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: unused-parameter
  exclusions:
    generated: strict
    rules:
      - path: _test\.go
        linters: [gosec, unparam]
formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    gofumpt:
      module-path: kapa/whatsapp
    goimports:
      local-prefixes: [kapa/whatsapp]
  exclusions:
    generated: strict
