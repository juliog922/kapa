# =============================================================================
#  Kapa - Docker Compose
#  Credentials are injected via --env-file (handled by the Makefile):
#    production -> .env      development/test -> .env.dev
#  Profile "ops" (production only): operational tooling such as the log viewer.
# =============================================================================

services:
  postgres:
    build:
      context: ./services/postgres
      args:
        POSTGRES_VERSION: ${POSTGRES_VERSION:-18}
    image: kapa-postgres:${KAPA_ENV:-local}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    ports:
      # Localhost only by default; set POSTGRES_BIND=0.0.0.0 to expose on the LAN.
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18+ images store data under /var/lib/postgresql/<major>/docker
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - kapa

  # WhatsApp gateway (gRPC :50051). Other services reach it at whatsapp:50051.
  # Sessions are stored in the shared database (tables prefixed whatsmeow_).
  whatsapp:
    build:
      context: ./services/whatsapp
      target: runtime
    image: kapa-whatsapp:${KAPA_ENV:-local}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      PGSSLMODE: disable
      GRPC_ADDR: ":50051"
      WA_LOG_LEVEL: ${WA_LOG_LEVEL:-WARN}
      WA_SELF_CHAT: ${WA_SELF_CHAT:-0}
    ports:
      - "127.0.0.1:${WHATSAPP_GRPC_PORT:-50051}:50051"
    labels:
      # make monitor runs this inside the container: accounts + protocol drift check
      kapa.status: "/whatsapp -status"
    healthcheck:
      test: ["CMD", "/whatsapp", "-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - kapa

  # Core service (Rust): Gmail accounts and admin mailbox. No network port: other modules
  # live inside it. Secrets are mounted read-only; they must be owned by uid 65532 (the
  # container user) with mode 0400 - `make deploy-secrets` does that on the server.
  core:
    build:
      context: ./services/core
      target: runtime
    image: kapa-core:${KAPA_ENV:-local}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      PGSSLMODE: disable
      ACCOUNTS_FILE: /run/secrets/core/accounts.${CORE_SECRETS:-prod}.env
      ADMIN_FILE: /run/secrets/core/admin.${CORE_SECRETS:-prod}.env
      SQLSERVER_FILE: /run/secrets/core/sqlserver.${CORE_SECRETS:-prod}.env
      STATUS_FILE: /tmp/core.status
      # Tachyon's socket (when the gpu profile runs it); core is its client.
      TACHYON_SOCKET: /run/tachyon/tachyon.sock
    volumes:
      - ./services/core/secrets:/run/secrets/core:ro
      - tachyon_run:/run/tachyon:ro
    labels:
      # make monitor runs this inside the container: Gmail accounts, counters, delivery delay
      kapa.status: "/core --status"
    healthcheck:
      test: ["CMD", "/core", "--healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - kapa

  # Tachyon (Rust, NVIDIA GPU): local inference (Gemma 4 chat, Laya decisions, Granite
  # embeddings). Clients connect to its Unix socket and get their own shared memory (memfd);
  # only processes of its uid (65532, like core) are admitted. Profile "gpu": hosts with an
  # NVIDIA GPU and the NVIDIA Container Toolkit set COMPOSE_PROFILES=gpu in their .env.
  tachyon:
    profiles: ["gpu"]
    build:
      context: ./services/tachyon
    image: kapa-tachyon:${KAPA_ENV:-local}
    restart: unless-stopped
    environment:
      TACHYON_KEEP_ALIVE: ${TACHYON_KEEP_ALIVE:-300}
      TACHYON_DATA_MIB: ${TACHYON_DATA_MIB:-64}
    volumes:
      - tachyon_models:/models
      - tachyon_run:/run/tachyon
    security_opt:
      # Docker's default seccomp profile plus io_uring, which the model loader needs
      # (services/tachyon/scripts/seccomp.py).
      - seccomp=./services/tachyon/seccomp.json
    ulimits:
      memlock: -1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    labels:
      # make monitor: the models, where they are (VRAM, host, disk), their time left
      kapa.status: "/tachyon ps"
    networks:
      - kapa

  # Web log viewer: live tail, search, filter and per-service views.
  # Bound to localhost; reach it from your machine with `make deploy-logs-ui`.
  dozzle:
    image: amir20/dozzle:${DOZZLE_VERSION:-latest}
    profiles: [ops]
    restart: unless-stopped
    environment:
      DOZZLE_FILTER: label=com.docker.compose.project=kapa
      DOZZLE_NO_ANALYTICS: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:${DOZZLE_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "/dozzle", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - kapa

volumes:
  # Pulled and converted models (O_DIRECT reads need a real filesystem, not the overlay).
  tachyon_models:
  # Tachyon's socket, shared with core: tmpfs owned by the shared uid, nobody else gets in.
  tachyon_run:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "uid=65532,gid=65532,mode=0700,size=1m"
  postgres_data:

networks:
  kapa: