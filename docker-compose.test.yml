# =============================================================================
#  Kapa - Test overrides (used only by `make test`)
#  Tests run inside the containers via `docker compose exec`, so no host ports
#  are published. This keeps the test stack isolated and conflict-free.
#  `!reset` requires Docker Compose v2.24+.
# =============================================================================

services:
  postgres:
    ports: !reset []
    restart: "no"
  whatsapp:
    ports: !reset []
    restart: "no"
  core:
    restart: "no"
    environment:
      # No secrets in the stack smoke test: core starts with no accounts (Gmail is covered
      # by `make -C services/core test`).
      ACCOUNTS_FILE: /run/secrets/core/none.env
      ADMIN_FILE: /run/secrets/core/none.env
  tachyon:
    restart: "no"
    # Models pulled for the GPU tests (make test-gpu) survive them: an external volume, which
    # `down -v` never removes, so ~3.7 GB are pulled once per machine.
    volumes: !override
      - tachyon_test_models:/models
      - tachyon_run:/run/tachyon

volumes:
  tachyon_test_models:
    external: true
    name: kapa-tachyon-models
